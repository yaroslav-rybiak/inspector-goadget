name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Major version of @abgov/web-components the fixture pages load
        web-components: ["3", "2"]
    name: test (web-components ${{ matrix.web-components }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cypress-io/github-action@v6
        with:
          command: npm test
        env:
          WC: ${{ matrix.web-components }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-wc${{ matrix.web-components }}
          path: cypress/screenshots
          if-no-files-found: ignore
