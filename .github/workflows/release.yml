# Stages the package on npmjs.com through npm trusted publishing (OIDC).
#
# Runs when a version tag is pushed (v2.3.0) or on demand with a tag name. Staging
# needs no npm token: npmjs.com trusts this repository's workflow after a one-time
# "Trusted Publisher" entry in the package settings (owner yaroslav-rybiak, repository
# inspector-goadget, workflow release.yml). The staged version becomes public only
# after a maintainer approves it on npmjs.com or with `npm stage approve`, which
# needs interactive two-factor authentication and therefore cannot happen in CI. npm
# adds a signed provenance statement to every version staged this way.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v2.3.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test (web-components ${{ matrix.web-components }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        web-components: ["3", "2"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cypress-io/github-action@v6
        with:
          command: npm test
        env:
          WC: ${{ matrix.web-components }}

  stage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow's identity (trusted publishing)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports staged trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Check that the tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm run typecheck
      - name: Show the identity presented to npmjs.com
        # Decodes the OIDC token's public claims so a "permission denied" from the
        # registry can be compared with the Trusted Publisher entry on npmjs.com.
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("npm:registry.npmjs.org");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            for (const key of ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"]) {
              core.info(`${key}: ${claims[key] ?? "(not set)"}`);
            }
      - run: npm stage publish
