# Publishes the package to npmjs.com through npm trusted publishing (OIDC).
#
# Runs when a version tag is pushed (v2.3.0) or on demand with a tag name. Publishing
# needs no npm token: npmjs.com trusts this repository's workflow after a one-time
# "Trusted Publisher" entry in the package settings (owner yaroslav-rybiak, repository
# inspector-goadget, workflow release.yml). npm adds a signed provenance statement to
# every version published this way.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v2.3.0"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: test (web-components ${{ matrix.web-components }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        web-components: ["3", "2"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cypress-io/github-action@v6
        with:
          command: npm test
        env:
          WC: ${{ matrix.web-components }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow's identity (trusted publishing)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Check that the tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm publish
