<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inspector-goadget fixture page</title>
    <!--
      Local test target for the Cypress specs in tests/.
      Served by Cypress's file server from the project root, so the paths
      below resolve into node_modules (see cypress.config.ts).
    -->
    <link rel="stylesheet" href="/node_modules/@abgov/web-components/index.css" />
    <script type="module" src="/node_modules/ionicons/dist/ionicons/ionicons.esm.js"></script>
    <script type="module" src="/node_modules/@abgov/web-components/index.js"></script>
    <style>
      main {
        max-width: 40rem;
        padding: var(--goa-space-xl, 2rem);
        font: var(--goa-typography-body-m, 1rem/1.5 sans-serif);
      }
      section {
        margin-bottom: var(--goa-space-2xl, 3rem);
      }
      section > * + * {
        margin-top: var(--goa-space-m, 1rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>inspector-goadget fixture page</h1>
      <p>One example per helper, rendered with the locally installed <code>@abgov/web-components</code>.</p>

      <section id="button">
        <h2>goa-button</h2>
        <goa-button type="primary">Primary Button</goa-button>
        <goa-button type="secondary">Submit and continue</goa-button>
        <p>Last clicked: <output id="last-clicked" data-testid="last-clicked"></output></p>
      </section>

      <section id="input">
        <h2>goa-input</h2>
        <goa-form-item label="Basic">
          <goa-input name="basic" id="basic-input"></goa-input>
        </goa-form-item>
      </section>

      <section id="dropdown">
        <h2>goa-dropdown</h2>
        <goa-form-item label="Basic dropdown">
          <goa-dropdown name="colour" id="basic-dropdown">
            <goa-dropdown-item value="red" label="Red"></goa-dropdown-item>
            <goa-dropdown-item value="green" label="Green"></goa-dropdown-item>
            <goa-dropdown-item value="blue" label="Blue"></goa-dropdown-item>
          </goa-dropdown>
        </goa-form-item>
        <p>Selected value: <output id="dropdown-value" data-testid="dropdown-value"></output></p>
      </section>

      <section id="file-upload">
        <h2>goa-file-upload-input</h2>
        <goa-form-item label="Upload a file">
          <goa-file-upload-input id="uploader" accept="image/*,.pdf" maxfilesize="5MB"></goa-file-upload-input>
          <div id="upload-cards"></div>
        </goa-form-item>
      </section>
    </main>

    <script type="module">
      // goa-button: record which button fired `_click` so specs can assert on it.
      const lastClicked = document.getElementById("last-clicked");
      for (const button of document.querySelectorAll("goa-button")) {
        button.addEventListener("_click", () => {
          lastClicked.textContent = button.textContent.trim();
        });
      }

      // goa-dropdown: record the value carried by the `_change` event.
      const dropdownValue = document.getElementById("dropdown-value");
      document.getElementById("basic-dropdown").addEventListener("_change", (event) => {
        dropdownValue.textContent = event.detail.value;
      });

      // goa-file-upload-input: mimic an app that uploads the selected file and
      // renders a goa-file-upload-card whose progress goes 0 -> 100.
      const uploader = document.getElementById("uploader");
      const cards = document.getElementById("upload-cards");
      uploader.addEventListener("_selectFile", (event) => {
        const file = event.detail.file;
        const card = document.createElement("goa-file-upload-card");
        card.setAttribute("filename", file.name);
        card.setAttribute("size", String(file.size));
        card.setAttribute("type", file.type);
        card.setAttribute("progress", "0");
        card.addEventListener("_cancel", () => card.remove());
        card.addEventListener("_delete", () => card.remove());
        cards.append(card);

        let progress = 0;
        const timer = setInterval(() => {
          progress = Math.min(progress + 20, 100);
          card.setAttribute("progress", String(progress));
          if (progress >= 100) clearInterval(timer);
        }, 100);
      });
    </script>
  </body>
</html>
