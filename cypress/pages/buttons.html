<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inspector-goadget fixture: buttons</title>
    <!--
      The web-components bundle is chosen at load time: ?wc=2 loads the pinned 2.x
      package (installed under the alias abgov-web-components-2), anything else the
      pinned 3.x package. CI runs the suite against both.
    -->
    <script>
      (function () {
        var major = new URLSearchParams(location.search).get("wc") === "2" ? "2" : "3";
        var base = major === "2" ? "/node_modules/abgov-web-components-2" : "/node_modules/@abgov/web-components";
        document.documentElement.dataset.webComponents = major;
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = base + "/index.css";
        document.head.appendChild(css);
        var js = document.createElement("script");
        js.type = "module";
        js.src = base + "/index.js";
        document.head.appendChild(js);
      })();
    </script>
    <script type="module" src="/node_modules/ionicons/dist/ionicons/ionicons.esm.js"></script>
    <style>
      main {
        max-width: 40rem;
        padding: var(--goa-space-xl, 2rem);
        font: var(--goa-typography-body-m, 1rem/1.5 sans-serif);
      }
      section {
        margin-bottom: var(--goa-space-2xl, 3rem);
      }
      section > * + * {
        margin-top: var(--goa-space-m, 1rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Buttons</h1>

      <section id="button">
        <h2>goa-button</h2>
        <goa-button type="primary">Primary Button</goa-button>
        <goa-button type="secondary">Submit and continue</goa-button>
        <span data-cy="next" data-test="alt-next"><goa-button type="tertiary" testid="next-btn">Next</goa-button></span>
        <span data-cy="confirm"><goa-button type="primary">Yes, submit application</goa-button></span>
        <span data-cy="late"></span>
        <div data-cy="late-form"></div>
        <p>Last clicked: <output id="last-clicked" data-testid="last-clicked"></output></p>
      </section>

    </main>

    <script type="module">
      // goa-button: record which button fired `_click` so specs can assert on it.
      const lastClicked = document.getElementById("last-clicked");
      const record = (button) =>
        button.addEventListener("_click", () => {
          lastClicked.textContent = button.textContent.trim();
        });
      document.querySelectorAll("goa-button").forEach(record);

      // Late content, like a dashboard that renders after its data arrives: used by the
      // `timeout` locator tests.
      setTimeout(() => {
        const late = document.createElement("goa-button");
        late.textContent = "Late button";
        record(late);
        document.querySelector('[data-cy="late"]').append(late);
        document.querySelector('[data-cy="late-form"]').innerHTML =
          '<goa-form-item label="Late input"><goa-input name="late"></goa-input></goa-form-item>';
      }, 1500);
    </script>
  </body>
</html>
